# MusicBox VPS Nginx 反代 —— TLS 终结 / WSS 升级 / 音频静态面 / 限流（2026-11-23）
# 用法：替换 musicbox.example.com 与证书路径后放入 sites-available；详见同目录 SETUP.md
# 上游约定：Music API 监听 127.0.0.1:7900（systemd: musicbox-api.service）
# 静态面：/f/ → var/out（文件名即不可猜 id；生产由 Nginx 直读，App 收到的 *_url 为绝对地址）

# WSS 升级开关（Connection: upgrade 透传）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 音频/文件接口限速区（按 IP）
limit_req_zone $binary_remote_addr zone=mbaudio:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mbapi:10m  rate=30r/s;

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name musicbox.example.com;
    # certbot 续用验证路径
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name musicbox.example.com;

    ssl_certificate     /etc/letsencrypt/live/musicbox.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicbox.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 上传上限：intent 语音 ≤10MB / persona 40s；与契约对齐
    client_max_body_size 12m;
    client_body_timeout 60s;

    access_log /var/log/nginx/musicbox.access.log;
    error_log  /var/log/nginx/musicbox.error.log warn;

    # 公共静态读（无鉴权，文件名为不可猜 id；生产由 Nginx 接管，API 不直出）
    location /f/ {
        alias /srv/musicbox/var/out/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;
        types { audio/mpeg mp3; audio/wav wav; application/json peaks.json; }
        limit_req zone=mbaudio burst=40 nodelay;
    }

    # WSS 事件面
    location /ws {
        proxy_pass http://127.0.0.1:7900;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # 长连接：生成期保活
        proxy_send_timeout 3600s;
    }

    # 执行器拉单口：仅放行内网执行器出口 IP（公网不可枚举）
    location /executor/ {
        allow 10.0.0.0/8;        # ← 改成你的内网/专线出口段
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:7900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 40s;  # 覆盖 25s long-poll
    }

    # 业务 REST（/v1/*、/healthz）
    location / {
        proxy_pass http://127.0.0.1:7900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        limit_req zone=mbapi burst=60 nodelay;
    }
}
