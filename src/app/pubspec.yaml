name: musicbox
description: "MusicBox · AI 音乐生成 App（Android 优先）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.5.1
  # 网络
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  # 本地存储（先缓存后网络）
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  # 播放（含后台/锁屏）
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.17
  # 录音/拍照（5.x 的 record_linux 传递依赖过旧会导致编译失败，故用 6.x）
  record: ^6.2.1
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
