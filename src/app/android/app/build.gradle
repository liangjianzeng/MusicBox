plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.musicbox.musicbox"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.musicbox.musicbox"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // 录音/相机/后台播放所需
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // 端侧语音：sherpa 的平台 AAR 自带 4 个 ABI 的 .so（合计 ≈104MB），
        // 本项目只发 arm64 真机，其余三个纯浪费安装体积。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packagingOptions {
        jniLibs {
            // .so 存压缩会让 Flutter 的 ClassLoader 取不到库（端侧语音实测踩过的坑）
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        // 正式签名：android/key.properties → 外部 key.jks（无该文件时回落 debug，CI 友好）
        release {
            def keystorePropsFile = rootProject.file("key.properties")
            if (keystorePropsFile.exists()) {
                def keystoreProps = new Properties()
                keystorePropsFile.withInputStream { keystoreProps.load(it) }
                storeFile = file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
                keyPassword = keystoreProps['keyPassword']
                keyAlias = keystoreProps['keyAlias']
            }
        }
    }

    buildTypes {
        release {
            def keystorePropsFile = rootProject.file("key.properties")
            signingConfig = keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        // debug 也用正式库签名（真机调测必须）。
        // 否则 debug 包 = Android Debug 通用库、正式包 = key.properties 里的库，两者签名不同，
        // 装到已装正式包的测试机上就是 INSTALL_FAILED_UPDATE_INCOMPATIBLE —— 只能先卸载，
        // 而卸载会把 prefs 一起带走（含 identity_device_key），真机身份与本地设置一并丢。
        // 用同一个库签名后 `adb install -r` 直接覆盖，数据不动。无 key.properties 时照旧回落 debug 库。
        debug {
            def keystorePropsFile = rootProject.file("key.properties")
            signingConfig = keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            // 并存逃生口（默认关闭，不设环境变量时包名一字不变，不影响任何人的装机与设备身份）：
            // 上面那条同签名纪律解决的是「同仓库 debug 覆盖 release」。剩下一类它解决不了 ——
            // 测试机上躺着**别人用另一把密钥**签的包（本次：小米13 上 11-28 02:17 那个 release，
            // 签名 9dc5cef8，run-as 还进不去），`-r` 必然 INSTALL_FAILED_UPDATE_INCOMPATIBLE，
            // 而 R4 禁止 uninstall（卸载会带走那台机上的游客身份）。这时只有一条不毁数据的路：
            // 换个包名并排放。用法 MB_APP_ID_SUFFIX=.mi13 flutter build apk --debug
            if (System.getenv('MB_APP_ID_SUFFIX') != null && System.getenv('MB_APP_ID_SUFFIX') != '') {
                applicationIdSuffix System.getenv('MB_APP_ID_SUFFIX')
            }
        }
    }
}

flutter {
    source = "../.."
}
